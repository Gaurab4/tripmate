services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: tripmate
      POSTGRES_USER: tripuser
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripuser -d tripmate"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: tripmate
      DB_USER: tripuser
      DB_PASSWORD: password
    volumes:
      # Mount code so changes apply without rebuilding; new migrations appear on host
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"

volumes:
  postgres_data:
